<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Synthese du cours AU331</title>
  <desc id="desc">Chaine de traitement du signal : acquisition, analyse, echantillonnage, filtrage et interpretation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
    </marker>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
  </defs>
  <rect width="920" height="360" rx="18" fill="url(#panel)"/>
  <g fill="none" stroke="#1f2937" stroke-width="2">
    <path d="M58 245 C110 110 160 110 212 245 S315 380 370 245 S475 110 530 245" stroke="#0f766e" stroke-width="4"/>
    <path d="M58 245 H548" stroke="#64748b"/>
    <path d="M58 80 V270" stroke="#64748b"/>
  </g>
  <text x="66" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700">Signal x(t)</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(610 42)">
      <rect width="240" height="52" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="20" y="32" fill="#0f172a" font-size="16" font-weight="700">Modeliser</text>
    </g>
    <g transform="translate(610 108)">
      <rect width="240" height="52" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="20" y="32" fill="#0f172a" font-size="16" font-weight="700">Analyser Fourier / Z</text>
    </g>
    <g transform="translate(610 174)">
      <rect width="240" height="52" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="20" y="32" fill="#0f172a" font-size="16" font-weight="700">Echantillonner</text>
    </g>
    <g transform="translate(610 240)">
      <rect width="240" height="52" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="20" y="32" fill="#0f172a" font-size="16" font-weight="700">Filtrer et reconstruire</text>
    </g>
  </g>
  <path d="M548 175 H592" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M730 94 V108" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M730 160 V174" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M730 226 V240" stroke="#1f6feb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="55" y="318" fill="#475569" font-family="Arial, sans-serif" font-size="15">Fil rouge : passer du temps a la frequence, puis du continu au discret, sans perdre l'information utile.</text>
</svg>
