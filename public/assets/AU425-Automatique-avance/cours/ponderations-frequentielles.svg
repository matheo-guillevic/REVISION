<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" role="img" aria-labelledby="title desc">
  <title id="title">Ponderations frequentielles pour la commande LQ</title>
  <desc id="desc">Commande u, prefiltre R moins un demi, procede G, postfiltre Q un demi et sortie ponderee.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#15803d"/>
    </marker>
    <style>
      .block{fill:#f0fdf4;stroke:#15803d;stroke-width:2}
      .line{fill:none;stroke:#15803d;stroke-width:2.4;marker-end:url(#arrow)}
      .txt{font:600 20px system-ui,Segoe UI,sans-serif;fill:#0f172a;text-anchor:middle}
      .lbl{font:16px system-ui,Segoe UI,sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>
  <text class="txt" x="65" y="95">u</text>
  <rect class="block" x="125" y="55" width="155" height="70" rx="12"/>
  <text class="txt" x="202" y="84">R<tspan baseline-shift="super" font-size="13">-1/2</tspan>(p)</text>
  <text class="lbl" x="202" y="109">prefiltre</text>
  <rect class="block" x="350" y="55" width="120" height="70" rx="12"/>
  <text class="txt" x="410" y="96">G(p)</text>
  <rect class="block" x="540" y="55" width="155" height="70" rx="12"/>
  <text class="txt" x="617" y="84">Q<tspan baseline-shift="super" font-size="13">1/2</tspan>(p)</text>
  <text class="lbl" x="617" y="109">postfiltre</text>
  <text class="txt" x="800" y="95">y ponderee</text>
  <path class="line" d="M80 90 H125"/>
  <path class="line" d="M280 90 H350"/>
  <path class="line" d="M470 90 H540"/>
  <path class="line" d="M695 90 H760"/>
</svg>
