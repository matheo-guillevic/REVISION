<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
  <title id="title">Observateur d'etat de Luenberger</title>
  <desc id="desc">La commande alimente le procede reel et le modele observateur ; l'innovation y moins y estimee corrige le modele par le gain L.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#4338ca"/>
    </marker>
    <style>
      .block{fill:#eef2ff;stroke:#4338ca;stroke-width:2}
      .sum{fill:#fff;stroke:#4338ca;stroke-width:2}
      .line{fill:none;stroke:#4338ca;stroke-width:2.3;marker-end:url(#arrow)}
      .txt{font:600 19px system-ui,Segoe UI,sans-serif;fill:#0f172a;text-anchor:middle}
      .lbl{font:15px system-ui,Segoe UI,sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>
  <text class="txt" x="65" y="95">u</text>
  <rect class="block" x="145" y="45" width="170" height="65" rx="12"/>
  <text class="txt" x="230" y="84">Procede reel</text>
  <rect class="block" x="145" y="205" width="190" height="65" rx="12"/>
  <text class="txt" x="240" y="230">Modele de</text>
  <text class="txt" x="240" y="253">l'observateur</text>
  <text class="txt" x="420" y="84">y</text>
  <text class="txt" x="420" y="244">y^</text>
  <circle class="sum" cx="520" cy="160" r="28"/>
  <text class="txt" x="520" y="154">y−y^</text>
  <text class="lbl" x="520" y="182">innovation</text>
  <rect class="block" x="620" y="130" width="115" height="60" rx="12"/>
  <text class="txt" x="677" y="166">L</text>
  <text class="txt" x="500" y="300">x^</text>
  <rect class="block" x="605" y="270" width="130" height="55" rx="12"/>
  <text class="txt" x="670" y="304">Retour K</text>
  <path class="line" d="M85 90 H145"/>
  <path class="line" d="M85 90 V238 H145"/>
  <path class="line" d="M315 78 H405"/>
  <path class="line" d="M335 238 H405"/>
  <path class="line" d="M430 78 C470 78 495 115 510 133"/>
  <path class="line" d="M430 238 C470 238 495 205 510 187"/>
  <path class="line" d="M548 160 H620"/>
  <path class="line" d="M735 160 C795 160 795 238 335 238"/>
  <path class="line" d="M335 255 C390 300 470 300 605 298"/>
</svg>
