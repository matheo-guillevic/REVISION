<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Commande par retour d'etat</title>
  <desc id="desc">La reference passe par le prefiltre h, la commande u alimente le procede, et l'etat x revient par le gain K au sommateur.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#be123c"/>
    </marker>
    <style>
      .block{fill:#fff1f2;stroke:#be123c;stroke-width:2}
      .sum{fill:#fff;stroke:#be123c;stroke-width:2}
      .line{fill:none;stroke:#be123c;stroke-width:2.4;marker-end:url(#arrow)}
      .txt{font:600 20px system-ui,Segoe UI,sans-serif;fill:#0f172a;text-anchor:middle}
      .lbl{font:16px system-ui,Segoe UI,sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>
  <text class="txt" x="70" y="94">y_ref</text>
  <rect class="block" x="125" y="65" width="70" height="55" rx="12"/>
  <text class="txt" x="160" y="99">h</text>
  <circle class="sum" cx="255" cy="92" r="25"/>
  <text class="txt" x="255" y="99">+</text>
  <text class="lbl" x="236" y="118">−</text>
  <text class="txt" x="330" y="99">u</text>
  <rect class="block" x="385" y="55" width="190" height="75" rx="12"/>
  <text class="txt" x="480" y="86">Procede</text>
  <text class="lbl" x="480" y="111">(A, B, C)</text>
  <text class="txt" x="655" y="99">y</text>
  <rect class="block" x="445" y="205" width="70" height="55" rx="12"/>
  <text class="txt" x="480" y="239">K</text>
  <text class="txt" x="650" y="215">x</text>
  <path class="line" d="M90 92 H125"/>
  <path class="line" d="M195 92 H230"/>
  <path class="line" d="M280 92 H385"/>
  <path class="line" d="M575 92 H640"/>
  <path class="line" d="M575 110 C650 110 665 185 515 233"/>
  <path class="line" d="M445 233 H255 V117"/>
</svg>
